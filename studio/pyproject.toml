[project]
name = "articul-studio"
version = "0.1.0"
description = "Small Vietnamese-focused audio studio: script -> sections -> adjustable TTS -> playback/export"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pydantic>=2.7",
    "python-multipart>=0.0.20",
]

[dependency-groups]
vieneu = [
    "vieneu>=0.1",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
